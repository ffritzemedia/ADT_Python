[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ADT"
version = "0.1.0"
description = "ADT fuer Schulen in NDS"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
include = ["ADT*"]

[tool.setuptools]
py-modules = ["adt", "searchtree", "trees"]
